<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Redirect — Mokshita Enterprises</title>
  <meta name="robots" content="noindex, nofollow" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="modules/auth.js"></script>
</head>
<body>
  <div style="font-family: sans-serif; text-align: center; margin-top: 100px;">
    <h2>Redirecting to your account dashboard...</h2>
    <p>If you are not redirected automatically, <a href="user-dashboard.html">click here</a>.</p>
  </div>
  <script>
    // Perform session verification first
    window.App.Auth.getCurrentUser().then(({ session }) => {
      if (session) {
        window.location.replace('user-dashboard.html');
      } else {
        window.location.replace('login.html');
      }
    }).catch(err => {
      console.error(err);
      window.location.replace('login.html');
    });
  </script>
</body>
</html>
