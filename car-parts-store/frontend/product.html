<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product — AutoParts Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span class="logo-icon">⚙</span> AutoParts Pro</a>
      <ul class="nav-links"><li><a href="shop.html">← Back to Shop</a></li></ul>
      <div class="header-actions">
        <a href="cart.html" class="icon-btn">🛒<span class="cart-badge">0</span></a>
        <a href="login.html" class="icon-btn" id="account-link">👤</a>
      </div>
    </div>
  </header>

  <div class="container product-detail" id="product-detail">
    <div class="loading">Loading product...</div>
  </div>

  <section class="section" id="related-section" style="display:none;">
    <div class="container">
      <div class="section-header"><h2>Related Parts</h2></div>
      <div class="product-grid" id="related-products"></div>
    </div>
  </section>

  <script src="js/app.js"></script>
  <script>
    const slug = new URLSearchParams(location.search).get('slug');
    let product = null;
    let qty = 1;

    async function loadProduct() {
      if (!slug) {
        document.getElementById('product-detail').innerHTML = '<p class="alert alert-error">Product not found</p>';
        return;
      }

      try {
        product = await api.getProductBySlug(slug);
        document.title = `${product.name} — AutoParts Pro`;

        const stockClass = product.stock === 0 ? 'stock-out' : product.stock < 20 ? 'stock-low' : 'stock-ok';
        const stockText = product.stock === 0 ? 'Out of stock' : product.stock < 20 ? `Only ${product.stock} left` : 'In stock';

        document.getElementById('product-detail').innerHTML = `
          <div class="product-gallery">
            <img src="${product.image_url}" alt="${product.name}" />
          </div>
          <div class="product-info">
            <div class="product-brand">${product.brand}</div>
            <h1>${product.name}</h1>
            <p class="product-meta">SKU: ${product.sku} · <a href="shop.html?category=${product.category_slug}" style="color:var(--accent)">${product.category_name}</a></p>
            <div class="price">${formatPrice(product.price)} ${product.compare_at_price ? `<span class="price-old">${formatPrice(product.compare_at_price)}</span>` : ''}</div>
            <p class="${stockClass}">${stockText}</p>
            <p class="product-desc">${product.description}</p>
            <div class="qty-row">
              <div class="qty-control">
                <button type="button" id="qty-minus">−</button>
                <input type="number" id="qty-input" value="1" min="1" max="${product.stock}" />
                <button type="button" id="qty-plus">+</button>
              </div>
              <button class="btn btn-primary" id="add-to-cart" ${product.stock === 0 ? 'disabled' : ''}>Add to Cart</button>
            </div>
            <dl class="detail-specs">
              <dt>Vehicle Fitment</dt><dd>${product.vehicle_fitment}</dd>
              <dt>Brand</dt><dd>${product.brand}</dd>
              <dt>Category</dt><dd>${product.category_name}</dd>
            </dl>
          </div>`;

        document.getElementById('qty-minus').onclick = () => { qty = Math.max(1, qty - 1); document.getElementById('qty-input').value = qty; };
        document.getElementById('qty-plus').onclick = () => { qty = Math.min(product.stock, qty + 1); document.getElementById('qty-input').value = qty; };
        document.getElementById('qty-input').onchange = e => { qty = Math.max(1, Math.min(product.stock, parseInt(e.target.value) || 1)); e.target.value = qty; };
        document.getElementById('add-to-cart').onclick = () => addToCart(product, qty);

        if (product.related?.length) {
          document.getElementById('related-section').style.display = 'block';
          document.getElementById('related-products').innerHTML = product.related.map(renderProductCard).join('');
          bindAddToCartButtons(product.related);
        }
      } catch (err) {
        document.getElementById('product-detail').innerHTML = `<p class="alert alert-error">${err.message}</p>`;
      }
    }

    loadProduct();
  </script>
</body>
</html>
