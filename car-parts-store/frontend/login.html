<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — AutoParts Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Sign In</h1>
      <p>Access your orders and saved details</p>
      <div id="auth-alert"></div>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required value="demo@autoparts.com" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required value="demo1234" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p>
      <p class="auth-switch" style="margin-top:8px;"><a href="index.html">← Back to store</a></p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    if (localStorage.getItem('autoparts_token')) location.href = 'account.html';

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      try {
        const { token } = await api.login(
          document.getElementById('email').value,
          document.getElementById('password').value
        );
        localStorage.setItem('autoparts_token', token);
        location.href = 'account.html';
      } catch (err) {
        document.getElementById('auth-alert').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
