<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — AutoParts Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Create Account</h1>
      <p>Track orders and checkout faster</p>
      <div id="auth-alert"></div>
      <form id="register-form">
        <div class="form-group">
          <label for="full_name">Full Name</label>
          <input type="text" id="full_name" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group">
          <label for="phone">Phone (optional)</label>
          <input type="tel" id="phone" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async e => {
      e.preventDefault();
      try {
        const { token } = await api.register(
          document.getElementById('email').value,
          document.getElementById('password').value,
          document.getElementById('full_name').value,
          document.getElementById('phone').value
        );
        localStorage.setItem('autoparts_token', token);
        location.href = 'account.html';
      } catch (err) {
        document.getElementById('auth-alert').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
