<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — AutoParts Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span class="logo-icon">⚙</span> AutoParts Pro</a>
      <ul class="nav-links"><li><a href="cart.html">← Back to Cart</a></li></ul>
    </div>
  </header>

  <div class="container checkout-page">
    <h1>Checkout</h1>
    <div id="checkout-alert"></div>

    <form id="checkout-form">
      <div class="checkout-section">
        <h2>Contact</h2>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com" />
        </div>
      </div>

      <div class="checkout-section">
        <h2>Shipping Address</h2>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="John Doe" />
        </div>
        <div class="form-group">
          <label for="address">Street Address</label>
          <input type="text" id="address" required placeholder="123 Main St" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" required />
          </div>
          <div class="form-group">
            <label for="state">State</label>
            <input type="text" id="state" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="zip">ZIP Code</label>
            <input type="text" id="zip" required />
          </div>
          <div class="form-group">
            <label for="country">Country</label>
            <select id="country"><option value="US">United States</option></select>
          </div>
        </div>
      </div>

      <div class="checkout-section">
        <h2>Order Summary</h2>
        <div id="checkout-summary">Loading...</div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="pay-btn">
        Pay with Stripe
      </button>
      <p style="text-align:center;margin-top:12px;font-size:0.82rem;color:var(--text-muted);">
        Secure payment powered by Stripe. Demo mode available without API keys.
      </p>
    </form>
  </div>

  <script src="js/app.js"></script>
  <script>
    const cart = getCart();
    if (cart.length === 0) location.href = 'cart.html';

    if (new URLSearchParams(location.search).get('cancelled')) {
      document.getElementById('checkout-alert').innerHTML = '<div class="alert alert-error">Payment was cancelled. Your cart is still saved.</div>';
    }

    async function loadSummary() {
      try {
        const validated = await api.validateCart(cart.map(i => ({ product_id: i.product_id, quantity: i.quantity })));
        document.getElementById('checkout-summary').innerHTML = `
          ${validated.items.map(i => `<div class="summary-row"><span>${i.product_name} × ${i.quantity}</span><span>${formatPrice(i.line_total)}</span></div>`).join('')}
          <div class="summary-row"><span>Subtotal</span><span>${formatPrice(validated.subtotal)}</span></div>
          <div class="summary-row"><span>Shipping</span><span>${validated.shipping === 0 ? 'FREE' : formatPrice(validated.shipping)}</span></div>
          <div class="summary-row"><span>Tax</span><span>${formatPrice(validated.tax)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${formatPrice(validated.total)}</span></div>`;
      } catch (err) {
        document.getElementById('checkout-summary').innerHTML = `<p class="alert alert-error">${err.message}</p>`;
      }
    }

    async function prefillUser() {
      const token = localStorage.getItem('autoparts_token');
      if (!token) return;
      try {
        const user = await api.getMe();
        document.getElementById('email').value = user.email;
        document.getElementById('name').value = user.full_name || '';
      } catch {}
    }

    document.getElementById('checkout-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('pay-btn');
      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        const order = await api.checkout({
          items: cart.map(i => ({ product_id: i.product_id, quantity: i.quantity })),
          guest_email: document.getElementById('email').value,
          shipping: {
            name: document.getElementById('name').value,
            address: document.getElementById('address').value,
            city: document.getElementById('city').value,
            state: document.getElementById('state').value,
            zip: document.getElementById('zip').value,
            country: document.getElementById('country').value,
          },
        });

        const payment = await api.createPaymentSession(order.order_id);

        if (payment.demo_mode) {
          localStorage.removeItem('autoparts_cart');
          location.href = payment.redirect_url;
        } else {
          location.href = payment.url;
        }
      } catch (err) {
        document.getElementById('checkout-alert').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
        btn.disabled = false;
        btn.textContent = 'Pay with Stripe';
      }
    });

    loadSummary();
    prefillUser();
  </script>
</body>
</html>
